<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Wholesale - Staff Onboarding &amp; Clearance Request</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-[#F8F9FA] text-[#0F172A] antialiased min-h-screen flex flex-col justify-between selection:bg-slate-200">

  <!-- Top Enterprise Security Banner -->
  <header class="w-full border-b border-slate-200 bg-white px-6 py-3"><div class="max-w-7xl mx-auto flex items-center justify-between"><div class="flex items-center space-x-3"><div class="w-8 h-8 rounded bg-slate-900 flex items-center justify-center text-white font-semibold text-sm"><svg class="w-5 h-5 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg></div><span class="text-sm font-bold tracking-tight text-slate-900">Apex Wholesale</span></div><div class="flex items-center space-x-4"><a href="#login" class="text-xs font-semibold text-slate-700 hover:text-slate-900 flex items-center space-x-1"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12" stroke-width="2"></line><polyline points="12 19 5 12 12 5" stroke-width="2"></polyline></svg><span class="">Existing Staff Login</span></a></div></div></header>

  <!-- Main Content Layout -->
  <main class="flex-1 flex items-center justify-center p-6 sm:p-10">
    <div class="w-full max-w-[640px]">
      
      <!-- Primary Card -->
      <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden p-6 sm:p-8"><div class="mb-6 text-center sm:text-left"><h1 class="text-lg font-bold text-slate-900 tracking-tight">Create Staff Account</h1><p class="text-xs text-slate-500 mt-1">Register your credentials to access the Apex Wholesale portal.</p></div><form class="space-y-4" onsubmit="event.preventDefault();"><div><label for="fullname" class="block text-xs font-semibold text-slate-700 mb-1.5">Full Name</label><input type="text" id="fullname" name="fullname" placeholder="e.g. Ananya Roy" required="" class="block w-full px-3 py-2 border border-slate-300 rounded text-xs text-slate-900 bg-white placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-slate-900 focus:border-slate-900"></div><div><label for="workemail" class="block text-xs font-semibold text-slate-700 mb-1.5">Work Email</label><input type="email" id="workemail" name="workemail" placeholder="name@apexwholesale.in" required="" class="block w-full px-3 py-2 border border-slate-300 rounded text-xs text-slate-900 bg-white placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-slate-900 focus:border-slate-900 font-mono"></div><div><label for="role" class="block text-xs font-semibold text-slate-700 mb-1.5">Role</label><select id="role" name="role" class="block w-full px-3 py-2 border border-slate-300 rounded text-xs text-slate-900 bg-white focus:outline-none focus:ring-1 focus:ring-slate-900 focus:border-slate-900 font-medium"><option value="warehouse">Warehouse Operations</option><option value="sales" selected="">Sales &amp; CRM</option><option value="accounts">Accounts &amp; Billing</option><option value="admin">System Administrator</option></select></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><div><label for="new_pass" class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label><input type="password" id="new_pass" name="new_pass" placeholder="••••••••••••" required="" class="block w-full px-3 py-2 border border-slate-300 rounded text-xs text-slate-900 bg-white placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-slate-900 focus:border-slate-900 font-mono"></div><div><label for="confirm_pass" class="block text-xs font-semibold text-slate-700 mb-1.5">Confirm Password</label><input type="password" id="confirm_pass" name="confirm_pass" placeholder="••••••••••••" required="" class="block w-full px-3 py-2 border border-slate-300 rounded text-xs text-slate-900 bg-white placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-slate-900 focus:border-slate-900 font-mono"></div></div><div class="pt-2"><button type="submit" class="w-full flex items-center justify-center space-x-2 bg-slate-900 hover:bg-slate-800 text-white py-2.5 px-4 rounded text-xs font-semibold tracking-wide transition-colors shadow-sm"><span class="">Create Account</span></button></div></form></div>

      <!-- Quick Context Switcher / Micro Helper -->
      <div class="mt-4 text-center"><p class="text-xs text-slate-500">Already have an account? <a href="#login" class="text-slate-900 font-semibold hover:underline ml-0.5">Sign in</a></p></div>

    </div>
  </main>

  <!-- Portal Footer -->
  <footer class="w-full border-t border-slate-200 bg-white px-6 py-3 text-xs text-slate-500"><div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-400"><div class="">© 2024 Apex Wholesale. All rights reserved.</div><div class="flex items-center space-x-4"><a href="#privacy" class="hover:text-slate-600">Privacy Policy</a><span class="">•</span><a href="#terms" class="hover:text-slate-600">Terms of Service</a><span class="">•</span><a href="#support" class="hover:text-slate-600">Help Desk</a></div></div></footer>




</body></html>
